-- ─────────────────────────────────────────────────────────────────
-- 3c. Double Cover Identity — paired geometric invariants
-- ─────────────────────────────────────────────────────────────────
-- Theorem: Two equivalent computation paths (sequential/parallel)
-- must produce identical C. This bundle stores both paths for
-- validation.

BUNDLE computed_double_cover
  BASE (
    regimen_id      CATEGORICAL INDEX,
    tissue_id       CATEGORICAL INDEX
  )
  FIBER (
    c_sequential    NUMERIC REQUIRED,       -- sequential path result
    c_parallel      NUMERIC REQUIRED,       -- parallel path result
    delta           NUMERIC REQUIRED,       -- |c_seq - c_par| (must be 0)
    cover_valid     BOOLEAN REQUIRED,       -- delta < epsilon
    drugs           TEXT,
    synergy         NUMERIC
  );

