-- ═══════════════════════════════════════════════════════════════════
-- MIRADOR Unified Pharmacokinetic Geometry Warehouse
-- ═══════════════════════════════════════════════════════════════════
--
-- The world's first geometric pharmacokinetic warehouse.
-- Every number from every source lives at a unique
-- (drug, pathogen, tissue, context) base point.
--
-- GIGI hashes the base point → u64 address.
-- You're not searching. You're addressing.
--
-- Architecture:
--   Layer 1 — Raw ingestion bundles (original schema per source)
--   Layer 2 — Harmonized bundle (pharma_universe, unified base space)
--   Layer 3 — Computed bundles (τ, K, C, Double Cover)
--   Layer 4 — Provenance bundle (I ∩ G = ∅ firewall)
--
-- Author: Bee Rosa Davis / Davis Geometric
-- Engine: GIGI (Geometric Intrinsic Global Index)
-- Format: GQL (Geometric Query Language)
-- ═══════════════════════════════════════════════════════════════════


-- ═════════════════════════════════════════════════════════════════
-- LAYER 1: RAW INGESTION BUNDLES
-- ═════════════════════════════════════════════════════════════════
-- One bundle per authoritative source, preserving original schema.
-- No transformations — raw data exactly as published.
-- ═════════════════════════════════════════════════════════════════


-- ─────────────────────────────────────────────────────────────────
-- 1a. EUCAST v14.0 — MIC Clinical Breakpoints
-- ─────────────────────────────────────────────────────────────────

BUNDLE raw_eucast
  BASE (
    drug_name       CATEGORICAL INDEX,
    organism        CATEGORICAL INDEX,
    indication      CATEGORICAL DEFAULT 'systemic'
  )
  FIBER (
    mic_s           NUMERIC REQUIRED,       -- susceptible breakpoint (µg/mL)
    mic_r           NUMERIC REQUIRED,       -- resistant breakpoint (µg/mL)
    standard        TEXT,                   -- "EUCAST v14.0" / "CLSI M100-Ed34"
    notes           TEXT
  );

