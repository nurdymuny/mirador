-- ─────────────────────────────────────────────────────────────────
-- Per-record provenance chain
-- ─────────────────────────────────────────────────────────────────

BUNDLE provenance_chain
  BASE (
    record_id       NUMERIC AUTO
  )
  FIBER (
    drug_id         CATEGORICAL INDEX,
    pathogen_id     CATEGORICAL INDEX,
    tissue_id       CATEGORICAL INDEX,
    field_name      CATEGORICAL INDEX,      -- which fiber field
    value           NUMERIC,
    source_id       CATEGORICAL INDEX,      -- → data_sources
    role            CATEGORICAL INDEX,      -- input | ground_truth
    extraction      TEXT,                   -- how value was extracted
    confidence      NUMERIC DEFAULT 1.0
  );

