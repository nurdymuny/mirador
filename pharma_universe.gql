-- ═════════════════════════════════════════════════════════════════
-- LAYER 4: PROVENANCE — I ∩ G = ∅ FIREWALL
-- ═════════════════════════════════════════════════════════════════
-- The provenance bundle makes the input/ground-truth separation
-- queryable topology. Every record traces back to its source.
-- ═════════════════════════════════════════════════════════════════

BUNDLE provenance_firewall
  BASE (
    disease         CATEGORICAL INDEX
  )
  FIBER (
    input_sources       TEXT REQUIRED,
    ground_truth_sources TEXT REQUIRED,
    overlap             CATEGORICAL DEFAULT 'NONE',
    test_count          NUMERIC,
    firewall_verified   BOOLEAN DEFAULT TRUE,
    verification_date   TEXT
  );

