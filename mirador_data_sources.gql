BUNDLE disease_mappings
  BASE (mapping_id NUMERIC AUTO)
  FIBER (
    source_id         CATEGORICAL INDEX,   -- MORPHISM → data_sources
    disease           CATEGORICAL INDEX,   -- bone_mrsa | pulmonary_tb | meningitis | hiv_reservoir
    role              CATEGORICAL INDEX,   -- input | ground_truth | cross_reference
    equation_layer    CATEGORICAL INDEX,   -- tau | K_barrier | K_phenotype | K_reservoir | K_admet | catalytic | threshold
    notes             TEXT
  );

