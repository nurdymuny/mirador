-- ═════════════════════════════════════════════════════════════════
-- LAYER 2 MORPHISMS — Raw → Harmonized mapping
-- ═════════════════════════════════════════════════════════════════
-- These fiber-preserving maps define how each raw bundle maps into
-- the unified pharma_universe base space.

MORPHISM eucast_to_universe
  FROM raw_eucast
  TO   pharma_universe
  MAP (
    drug_name  → drug_id,
    organism   → pathogen_id,
    indication → tissue_id,             -- 'systemic' | 'meningitis'  → tissue context
    --           context_id DEFAULT 'adult_standard'
    mic_s      → mic
  );

MORPHISM who_cc_to_universe
  FROM raw_who_cc
  TO   pharma_universe
  MAP (
    drug_name  → drug_id,
    --           pathogen_id DEFAULT 'M. tuberculosis'
    --           tissue_id DEFAULT 'lung'
    cc_mg_L    → mic
  );

MORPHISM hivdb_to_universe
  FROM raw_stanford_hivdb
  TO   pharma_universe
  MAP (
    drug_name    → drug_id,
    --             pathogen_id DEFAULT 'HIV-1'
    ic50_nM      → ic50,
    auc_24_nM_hr → auc_24
  );

MORPHISM tissue_to_universe
  FROM raw_tissue_penetration
  TO   pharma_universe
  MAP (
    drug_name → drug_id,
    tissue    → tissue_id,
    r_value   → tissue_plasma_ratio
  );

MORPHISM biofilm_to_universe
  FROM raw_biofilm
  TO   pharma_universe
  MAP (
    drug_name → drug_id,
    organism  → pathogen_id,
    mbec      → mbec,
    mic       → mic
  );


-- ═════════════════════════════════════════════════════════════════
-- LAYER 3: COMPUTED BUNDLES — τ, K, C, Double Cover
-- ═════════════════════════════════════════════════════════════════
-- Sheaf evaluations computed at insert time.
-- Each section is a derived geometric invariant.
-- ═════════════════════════════════════════════════════════════════


-- ─────────────────────────────────────────────────────────────────
-- 3a. K-decomposition: pathway curvature per base point
-- ─────────────────────────────────────────────────────────────────

BUNDLE computed_k_pathway
  BASE (
    drug_id         CATEGORICAL INDEX,
    pathogen_id     CATEGORICAL INDEX,
    tissue_id       CATEGORICAL INDEX,
    context_id      CATEGORICAL INDEX
  )
  FIBER (
    k_admet         NUMERIC,                -- log-scale host clearance penalty
    k_barrier       NUMERIC,                -- -log₁₀(R) tissue barrier
    k_phenotype     NUMERIC,                -- log₁₀(MBEC/MIC) or subpop tolerance
    k_reservoir     NUMERIC,                -- stochastic reactivation (HIV latent)
    k_pathway       NUMERIC REQUIRED,       -- sum of all K components
    formula         TEXT                     -- human-readable decomposition
  );

-- Bone MRSA K-decomposition
SECTION INTO computed_k_pathway VALUES
  ('vancomycin',  'MRSA', 'bone', 'pediatric_8yo_25kg',
   0.30, 0.6990, 2.709, 0.00, 5.78,
   'K = 0.30 + 0.6990 + 2.709 + p_bio*(K_bio+K_res) [INT-9]'),

  ('ceftaroline', 'MRSA', 'bone', 'pediatric_8yo_25kg',
   0.45, 0.5229, 2.107, 0.00, 4.23,
   'K = 0.45 + 0.5229 + 2.107 + p_bio*K_bio [INT-9]'),

  ('rifampin',    'MRSA', 'bone', 'pediatric_8yo_25kg',
   0.67, 0.4559, 1.796, 0.00, 3.44,
   'K = 0.67 + 0.4559 + 1.796 + p_bio*K_bio [INT-9]');


-- ─────────────────────────────────────────────────────────────────
-- 3b. Coherence scores: C = τ / K_pathway
-- ─────────────────────────────────────────────────────────────────

BUNDLE computed_coherence
  BASE (
    drug_id         CATEGORICAL INDEX,
    pathogen_id     CATEGORICAL INDEX,
    tissue_id       CATEGORICAL INDEX,
    context_id      CATEGORICAL INDEX
  )
  FIBER (
    tau             NUMERIC REQUIRED,
    k_pathway       NUMERIC REQUIRED,
    coherence       NUMERIC REQUIRED,       -- C = τ / K
    rank            NUMERIC,                -- 1 = best in class
    above_threshold BOOLEAN                 -- C ≥ 1.0
  );

