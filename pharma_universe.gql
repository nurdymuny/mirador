-- CURVATURE QUERIES (GIGI native)
-- ═════════════════════════════════════════════════════════════════
-- High curvature in a fiber field = high variance = low confidence.
-- The warehouse self-diagnoses data quality geometrically.
--
-- COVER ON pharma_universe
--   WHERE drug_id = 'vancomycin'
--     AND pathogen_id = 'MRSA'
--     AND tissue_id = 'bone'
--   EVALUATE coherence;
--
-- → Returns: { coherence: 2.08, curvature: 0.15, confidence: 0.85 }
--
-- COVER ON pharma_universe
--   WHERE pathogen_id = 'HIV-1'
--     AND tissue_id = 'cns'
--   EVALUATE coherence
--   ORDER BY coherence DESC;
--
-- → Returns ranked CNS penetration for all ARVs
--
-- COVER ON computed_double_cover
--   WHERE cover_valid = FALSE;
--
-- → Returns empty set if all identities hold (validation pass)
-- ═════════════════════════════════════════════════════════════════


