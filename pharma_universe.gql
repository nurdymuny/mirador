-- ═════════════════════════════════════════════════════════════════
-- LAYER 2: HARMONIZED MASTER BUNDLE — pharma_universe
-- ═════════════════════════════════════════════════════════════════
-- Every raw record maps into this unified (drug, pathogen, tissue,
-- context) base space via MORPHISMS below.
--
-- GIGI hashes (drug_id, pathogen_id, tissue_id, context_id) → u64.
-- O(1) point query. You're not searching. You're addressing.
-- ═════════════════════════════════════════════════════════════════

BUNDLE pharma_universe
  BASE (
    drug_id         CATEGORICAL INDEX,      -- RxNorm CUI or short name
    pathogen_id     CATEGORICAL INDEX,      -- NCBI Taxonomy ID or name
    tissue_id       CATEGORICAL INDEX,      -- UBERON ontology or name
    context_id      CATEGORICAL INDEX       -- patient population hash
  )
  FIBER (
    mic             NUMERIC,                -- MIC or IC₅₀ (source units)
    mic_source      TEXT,                   -- EUCAST / CLSI / HIVDB
    ic50            NUMERIC,                -- IC₅₀ (nM, for antivirals)
    auc_24          NUMERIC,                -- AUC₂₄ (source units)
    tissue_plasma_ratio NUMERIC,            -- R value
    mbec            NUMERIC,                -- MBEC (µg/mL, if biofilm)
    k_barrier       NUMERIC,                -- -log₁₀(R)
    k_phenotype     NUMERIC,                -- log₁₀(MBEC/MIC) or subpop
    tau             NUMERIC,                -- log₁₀(AUC₂₄/MIC)
    coherence       NUMERIC,                -- C = τ/K_pathway
    confidence      NUMERIC,                -- 1/curvature (high = low variance)
    citation_key    TEXT,                   -- primary citation
    assay_method    TEXT,                   -- broth microdilution / MALDI / etc.
    n_subjects      NUMERIC,                -- sample size
    year            NUMERIC                 -- publication year
  );


