-- 1d. Tissue Penetration — Multi-source R values
-- ─────────────────────────────────────────────────────────────────

BUNDLE raw_tissue_penetration
  BASE (
    drug_name       CATEGORICAL INDEX,
    tissue          CATEGORICAL INDEX,
    condition       CATEGORICAL DEFAULT 'standard'
  )
  FIBER (
    r_value         NUMERIC REQUIRED,       -- tissue:plasma ratio
    r_low           NUMERIC,                -- range lower bound
    r_high          NUMERIC,                -- range upper bound
    source          TEXT REQUIRED
  );

