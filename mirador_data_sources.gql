BUNDLE validation_firewall
  BASE (disease CATEGORICAL INDEX)
  FIBER (
    input_sources      TEXT REQUIRED,     -- comma-separated source_ids in set I
    ground_truth_sources TEXT REQUIRED,   -- comma-separated source_ids in set G
    overlap            CATEGORICAL DEFAULT 'NONE',  -- NONE | FLAGGED
    test_count         NUMERIC,
    firewall_verified  BOOLEAN DEFAULT TRUE
  );

