-- ═══════════════════════════════════════════════════════════════════
-- MIRADOR Data Source Registry — GIGI Schema (GQL)
-- ═══════════════════════════════════════════════════════════════════
-- Every database, repository, and primary literature source that
-- feeds C = τ/K across all four disease instances.
--
-- Author: Bee Rosa Davis / Davis Geometric
-- Engine: GIGI (Geometric Intrinsic Global Index)
-- Format: GQL (Geometric Query Language)
-- Created: 2026-03-26
--
-- Architecture:
--   data_sources        → master catalog of all sources
--   source_categories   → taxonomy (susceptibility, PK, tissue, etc.)
--   disease_mappings    → which sources feed which disease instance
--   equation_layers     → which part of C = τ/K each source feeds
--   citations           → full bibliographic records
--   validation_firewall → input set I vs ground truth set G separation
-- ═══════════════════════════════════════════════════════════════════


-- ─────────────────────────────────────────────────────────────────
-- BUNDLE 1: Source Categories (taxonomy)
-- ─────────────────────────────────────────────────────────────────

BUNDLE source_categories
  BASE (category_id CATEGORICAL INDEX)
  FIBER (
    name              TEXT REQUIRED,
    description       TEXT,
    equation_target   CATEGORICAL INDEX,     -- tau_numerator | tau_denominator | K_barrier | K_phenotype | K_reservoir | K_admet | ground_truth | structural | meta
    data_flow         CATEGORICAL DEFAULT 'input'  -- input | ground_truth | cross_reference | annotation
  );

SECTION INTO source_categories VALUES
  ('SUSCEPTIBILITY',    'MIC, IC50, breakpoint databases',                        'tau_denominator', 'input'),
  ('PHARMACOKINETICS',  'AUC, clearance, Vd, systemic PK parameters',            'tau_numerator',   'input'),
  ('TISSUE_BONE',       'Bone tissue:plasma ratios (R values)',                   'K_barrier',       'input'),
  ('TISSUE_CASEUM',     'TB caseum/granuloma tissue:plasma ratios',               'K_barrier',       'input'),
  ('TISSUE_CSF',        'CSF/BBB tissue:plasma ratios',                           'K_barrier',       'input'),
  ('TISSUE_HIV',        'HIV reservoir tissue:plasma ratios',                     'K_barrier',       'input'),
  ('BIOFILM',           'MBEC, biofilm-specific susceptibility data',             'K_phenotype',     'input'),
  ('RESISTANCE',        'Genotypic/phenotypic resistance databases',              'K_phenotype',     'input'),
  ('CLINICAL_OUTCOMES', 'Guidelines, trial outcomes, ground truths',              'ground_truth',    'ground_truth'),
  ('STRUCTURAL',        'Protein structures, binding data, molecular targets',    'structural',      'cross_reference'),
  ('GENOMIC',           'Pathogen genomics, mutation databases',                  'structural',      'cross_reference'),
  ('PHARMACOGENOMIC',   'Metabolizer phenotypes, allele frequencies',             'K_admet',         'input'),
  ('EPIDEMIOLOGICAL',   'Surveillance, incidence, prevalence',                    'meta',            'cross_reference'),
  ('ONTOLOGIES',        'Chemical, disease, and drug ontologies',                 'meta',            'annotation'),
  ('COMPUTATIONAL',     'PBPK platforms, modeling tools',                         'meta',            'cross_reference'),
  ('PEDIATRIC',         'Pediatric PK adjustments, allometric scaling',           'K_admet',         'input');


-- ─────────────────────────────────────────────────────────────────
-- BUNDLE 2: Master Data Sources
-- ─────────────────────────────────────────────────────────────────

BUNDLE data_sources
  BASE (source_id CATEGORICAL UNIQUE)
  FIBER (
    name              TEXT REQUIRED,
    url               TEXT,
    category_id       CATEGORICAL INDEX,     -- MORPHISM → source_categories
    source_type       CATEGORICAL INDEX,     -- database | review_paper | primary_study | guideline | tool | ontology
    access_level      CATEGORICAL DEFAULT 'free',  -- free | paywalled | commercial | restricted
    version           TEXT,
    record_count      TEXT,                  -- human-readable (e.g., "30,000+ MIC distributions")
    curators          TEXT,
    mirador_usage     TEXT REQUIRED,         -- exactly what this feeds in C = τ/K
    citation_key      TEXT,                  -- links to citations bundle
    notes             TEXT
  );

