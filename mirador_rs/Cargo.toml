[workspace]
members = [
    "crates/mirador-core",
    "crates/mirador-patient",
    "crates/mirador-target",
    "crates/mirador-candidate",
    "crates/mirador-bundle",
    "crates/mirador-pharmacophore",
    "crates/mirador-admet",
    "crates/mirador-optimizer",
    "crates/mirador-resistance",
    "crates/mirador-combination",
    "crates/mirador-dosing",
    "crates/mirador-integration",
    "crates/mirador-pediatric",
    "crates/mirador-bone",
    "crates/mirador-biofilm",
    "crates/mirador-reservoir",
    "crates/mirador-combo-bone",
    "crates/mirador-tb-patient",
    "crates/mirador-granuloma",
    "crates/mirador-tb-phenotype",
    "crates/mirador-tb-reservoir",
    "crates/mirador-tb-combo",
    "crates/mirador-hiv-reservoir",
    "crates/mirador-hiv-wasm",
    "crates/mirador-tb-wasm",
    "crates/mirador-meningitis",
    "crates/mirador-meningitis-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Bee Rosa Davis <davis@davisgeometric.com>"]

[workspace.dependencies]
nalgebra = "0.33"
ndarray = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
approx = "0.5"
